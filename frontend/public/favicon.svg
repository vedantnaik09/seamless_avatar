<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#6b46ff"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="12" fill="url(#g)" />

  <!-- bold 'F' built from rectangles for legibility at small sizes -->
  <g filter="url(#s)" fill="#fff">
    <!-- vertical stem -->
    <rect x="12" y="12" width="12" height="40" rx="2" />
    <!-- top bar -->
    <rect x="24" y="12" width="28" height="10" rx="2" />
    <!-- middle bar -->
    <rect x="24" y="30" width="20" height="10" rx="2" />
  </g>
</svg>
